name = "scout"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scout"
database_id = "00000000-0000-0000-0000-000000000000"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
