# Запуск: docker compose up -d
# Приложение доступно только через Caddy (он сам получает бесплатный HTTPS-сертификат).
services:
  scout:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LS_TRUSTED_PROXIES: "*"   # наружу порт приложения не открыт, запросы приходят только от Caddy
    volumes:
      - scout-data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [scout]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${LS_DOMAIN:?Укажите LS_DOMAIN в файле .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  scout-data:
  caddy-data:
  caddy-config:
