[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-scout"
version = "1.0.0"
description = "Личный ИИ-скаут фриланс-заказов из Telegram-чатов"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "anthropic>=1.0",
  "telethon>=1.36",
  "httpx>=0.27",
  "cryptography>=42",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pillow>=10"]

[project.scripts]
leadscout = "leadscout.__main__:main"

[tool.setuptools.packages.find]
include = ["leadscout*"]

[tool.setuptools.package-data]
leadscout = ["web/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/test_recall.py" = ["F811"]
